[package]
name = "luar-rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "luar"
path = "src/main.rs"

[dependencies]
full_moon = { version = "=2.2.0", default-features = false, features = ["lua54"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
